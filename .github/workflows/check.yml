name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - run: KRS_STRICT_TOOLCHAIN=1 task check
        env:
          KRS_CHECK_DIR: ${{ runner.temp }}/krs-check-022
