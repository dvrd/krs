name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: krs-releases
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Build, test and package
        env:
          KRS_STRICT_TOOLCHAIN: '1'
          KRS_CHECK_DIR: ${{ runner.temp }}/krs-release
        run: |
          task version:tool
          sh tools/version/release.sh prepare "$RUNNER_TEMP/krs-dist"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -f "$RUNNER_TEMP/krs-dist/tag" ] || exit 0
          sh tools/version/release.sh publish --sync-develop "$RUNNER_TEMP/krs-dist"
