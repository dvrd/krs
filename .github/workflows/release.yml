name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      release: ${{ steps.prepare.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Build, test and package
        id: prepare
        env:
          KRS_STRICT_TOOLCHAIN: '1'
          KRS_CHECK_DIR: ${{ runner.temp }}/krs-release
        run: |
          task version:tool
          "$KRS_CHECK_DIR/krs-version" prepare "$RUNNER_TEMP/krs-dist"
          if [ -f "$RUNNER_TEMP/krs-dist/tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the prepared release
        if: steps.prepare.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krs-dist
          path: ${{ runner.temp }}/krs-dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    concurrency:
      group: krs-releases
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download the prepared release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: krs-dist
          path: ${{ runner.temp }}/krs-dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            printf 'krs: %s\n' "$*" >&2
            exit 1
          }

          dist="$RUNNER_TEMP/krs-dist"
          [ -f "$dist/tag" ] || fail "$dist holds no prepared release"
          tag=$(cat "$dist/tag")
          target=$(cat "$dist/target")
          [ -n "${GH_TOKEN:-}" ] || fail 'syncing develop needs GH_TOKEN'
          [ -n "${GITHUB_REPOSITORY:-}" ] || fail 'syncing develop needs GITHUB_REPOSITORY'

          git fetch --quiet origin main
          main=$(git rev-parse --verify origin/main)
          [ "$target" = "$main" ] ||
            fail "releases are published from main; $target is not origin/main ($main)"

          if draft=$(gh release view "$tag" --json isDraft -q .isDraft 2> "$RUNNER_TEMP/view-error"); then
            case $draft in
            true)
              fail "draft release $tag exists; publish or delete it"
              ;;
            false)
              printf 'krs: %s is already released\n' "$tag"
              exit 0
              ;;
            *)
              fail "gh release view $tag printed '$draft'"
              ;;
            esac
          fi
          grep -q 'release not found' "$RUNNER_TEMP/view-error" || fail "$(cat "$RUNNER_TEMP/view-error")"

          assets=()
          for asset in "$dist/krs-$tag-"*.tar.gz; do
            [ -f "$asset" ] && [ -f "$asset.sha256" ] || fail "$dist holds no package for $tag"
            assets+=("$asset" "$asset.sha256")
          done
          gh release create "$tag" "${assets[@]}" --target "$target" --title "krs $tag" \
            --notes-file "$dist/notes.md" --latest
          printf 'krs: released %s\n' "$tag"

          # Fast-forward only: a rejected push means develop moved since the merge.
          if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${target}:refs/heads/develop"; then
            printf 'krs: develop now contains %s\n' "$tag"
          else
            printf '::warning::develop has moved since the merge; merge main into develop to bring in %s\n' "$tag"
          fi
