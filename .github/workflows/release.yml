name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      release: ${{ steps.prepare.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Build, test and package
        id: prepare
        env:
          KRS_STRICT_TOOLCHAIN: '1'
          KRS_CHECK_DIR: ${{ runner.temp }}/krs-release
        run: |
          task version:tool
          sh tools/version/release.sh prepare "$RUNNER_TEMP/krs-dist"
          if [ -f "$RUNNER_TEMP/krs-dist/tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the prepared release
        if: steps.prepare.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krs-dist
          path: ${{ runner.temp }}/krs-dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    concurrency:
      group: krs-releases
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download the prepared release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: krs-dist
          path: ${{ runner.temp }}/krs-dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sh tools/version/release.sh publish --sync-develop "$RUNNER_TEMP/krs-dist"
