version: '3'

tasks:
  default:
    desc: Build KRS and run its tests
    aliases: [check]
    cmds:
      - task: build
      - task: test

  build:
    desc: Build the KRS binary
    cmds:
      - task: odin
        vars: {ACTION: build, PACKAGE: cmd/krs, BINARY: krs, OPT: '{{.OPT | default "speed"}}', QUIET: '{{.QUIET}}'}

  install:
    desc: Build KRS and install it in ~/.local/bin or KRS_INSTALL_DIR
    silent: true
    cmds:
      - sh tools/install.sh

  test:
    desc: Run the KRS test suite
    cmds:
      - task: odin
        vars: {ACTION: test, PACKAGE: tests, BINARY: krs-tests, OPT: none}
      - task: odin
        vars: {ACTION: test, PACKAGE: tools/version, BINARY: krs-version-tests, OPT: none}

  version:
    desc: Print the release version
    silent: true
    cmds:
      - printf '%s\n' "${KRS_VERSION:-$(git describe --tags --match 'v[0-9]*' --dirty 2>/dev/null || echo dev)}"

  version:next:
    desc: Preview the next version from Conventional Commits
    silent: true
    cmds:
      - task: version:tool
      - sh tools/version/release.sh next

  release:
    desc: Publish the next release to GitHub (use -- --dry-run to preview)
    silent: true
    cmds:
      - task: version:tool
      - |
        set -e
        out="${KRS_CHECK_DIR:-${TMPDIR:-/tmp}/krs-check}"
        case '{{.CLI_ARGS}}' in
          --dry-run)
            sh tools/version/release.sh prepare --dry-run "$out/release"
            ;;
          '')
            sh tools/version/release.sh prepare "$out/release"
            if [ -f "$out/release/tag" ]; then
              sh tools/version/release.sh publish "$out/release"
            fi
            ;;
          *)
            printf 'krs: usage: task release [-- --dry-run]\n' >&2
            exit 2
            ;;
        esac

  version:tool:
    internal: true
    cmds:
      - task: odin
        vars: {ACTION: build, PACKAGE: tools/version, BINARY: krs-version, OPT: none, QUIET: 'true'}

  toolchain:
    internal: true
    run: once
    cmds:
      - sh tools/check-toolchain.sh

  odin:
    internal: true
    silent: true
    deps: [toolchain]
    cmds:
      - |
        set -e
        out="${KRS_CHECK_DIR:-${TMPDIR:-/tmp}/krs-check}"
        git_libdir=$(pkg-config --variable=libdir libgit2)
        link_flags="-L\"$git_libdir\""
        if [ "$(uname -s)" != Darwin ]; then
          link_flags="$link_flags -Wl,-rpath,$git_libdir"
        fi
        version="${KRS_VERSION:-$(git describe --tags --match 'v[0-9]*' --dirty 2>/dev/null || echo dev)}"
        mkdir -p "$out"
        odin {{.ACTION}} {{.PACKAGE}} -out:"$out/{{.BINARY}}" -vet -o:{{.OPT | default "none"}} \
          "-define:KRS_VERSION=$version" "-extra-linker-flags:$link_flags"
        if [ '{{.QUIET}}' != true ]; then
          printf 'krs: %s complete (%s/%s)\n' '{{.ACTION}}' "$out" '{{.BINARY}}'
        fi
