version: '3'

tasks:
  default:
    desc: Build KRS and run its tests
    aliases: [check]
    cmds:
      - task: build
      - task: test

  build:
    desc: Build the KRS binary; nothing to do when no input changed
    silent: true
    deps: [toolchain]
    cmds:
      - '"${KRS_CHECK_DIR:-${TMPDIR:-/tmp}/krs-check}/krs-dev" build'

  install:
    desc: Build KRS and install it in ~/.local/bin or KRS_INSTALL_DIR
    silent: true
    deps: [toolchain]
    cmds:
      - '"${KRS_CHECK_DIR:-${TMPDIR:-/tmp}/krs-check}/krs-dev" install'

  test:
    desc: Run the KRS test suite
    deps: [toolchain]
    cmds:
      - '"${KRS_CHECK_DIR:-${TMPDIR:-/tmp}/krs-check}/krs-dev" test-layout'
      - task: odin
        vars: {ACTION: test, PACKAGE: tests/unit, BINARY: krs-unit-tests, OPT: none}
      - task: odin
        vars: {ACTION: test, PACKAGE: tests/e2e, BINARY: krs-e2e-tests, OPT: none}
      - task: odin
        vars: {ACTION: test, PACKAGE: tools/version, BINARY: krs-version-tests, OPT: none}
      - task: odin
        vars: {ACTION: test, PACKAGE: tools/dev, BINARY: krs-dev-tests, OPT: none}

  version:
    desc: Print the release version
    silent: true
    cmds:
      - printf '%s\n' "${KRS_VERSION:-$(git describe --tags --match 'v[0-9]*' --dirty 2>/dev/null || echo dev)}"

  version:next:
    desc: Preview the next version from Conventional Commits
    silent: true
    cmds:
      - task: version:tool
      - '"${KRS_CHECK_DIR:-${TMPDIR:-/tmp}/krs-check}/krs-version" next'

  release:
    desc: Preview the next release locally (version, notes, package)
    silent: true
    cmds:
      - task: version:tool
      - |
        set -e
        out="${KRS_CHECK_DIR:-${TMPDIR:-/tmp}/krs-check}"
        "$out/krs-version" prepare --dry-run "$out/release"

  # Called by the release workflow; no desc keeps it out of `task --list`.
  version:tool:
    cmds:
      - task: odin
        vars: {ACTION: build, PACKAGE: tools/version, BINARY: krs-version, OPT: none, QUIET: 'true'}

  toolchain:
    internal: true
    run: once
    silent: true
    cmds:
      - |
        set -e
        out="${KRS_CHECK_DIR:-${TMPDIR:-/tmp}/krs-check}"
        mkdir -p "$out"
        odin build tools/dev -out:"$out/krs-dev" -vet -o:none
        "$out/krs-dev" toolchain

  odin:
    internal: true
    silent: true
    deps: [toolchain]
    cmds:
      - |
        set -e
        out="${KRS_CHECK_DIR:-${TMPDIR:-/tmp}/krs-check}"
        git_libdir=$(pkg-config --variable=libdir libgit2)
        link_flags="-L\"$git_libdir\""
        if [ "$(uname -s)" != Darwin ]; then
          link_flags="$link_flags -Wl,-rpath,$git_libdir"
        fi
        version="${KRS_VERSION:-$(git describe --tags --match 'v[0-9]*' --dirty 2>/dev/null || echo dev)}"
        mkdir -p "$out"
        odin {{.ACTION}} {{.PACKAGE}} -out:"$out/{{.BINARY}}" -vet -o:{{.OPT | default "none"}} \
          "-define:KRS_VERSION=$version" "-extra-linker-flags:$link_flags"
        if [ '{{.QUIET}}' != true ]; then
          printf 'krs: %s complete (%s/%s)\n' '{{.ACTION}}' "$out" '{{.BINARY}}'
        fi
