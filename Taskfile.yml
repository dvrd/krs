version: '3'

tasks:
  default:
    desc: Build KRS and run its tests
    aliases: [check]
    cmds:
      - task: build
      - task: test

  build:
    desc: Build the KRS binary
    cmds:
      - task: odin
        vars: {ACTION: build, PACKAGE: cmd/krs, BINARY: krs}

  test:
    desc: Run the KRS test suite
    cmds:
      - task: odin
        vars: {ACTION: test, PACKAGE: tests, BINARY: krs-tests}
      - task: odin
        vars: {ACTION: test, PACKAGE: tools/version, BINARY: krs-version-tests}

  version:
    desc: Print the release version
    silent: true
    cmds:
      - cat src/VERSION

  version:next:
    desc: Preview the next version from Conventional Commits
    silent: true
    cmds:
      - task: version:tool
      - sh tools/version/release.sh next

  release:
    desc: Build, test, commit, and tag the next release from Conventional Commits
    silent: true
    cmds:
      - task: version:tool
      - sh tools/version/release.sh release

  version:tool:
    internal: true
    cmds:
      - task: odin
        vars: {ACTION: build, PACKAGE: tools/version, BINARY: krs-version, QUIET: 'true'}

  odin:
    internal: true
    silent: true
    preconditions:
      - sh: pkg-config --exists libgit2
        msg: Install libgit2 and make it available to pkg-config
    cmds:
      - |
        set -e
        out="${KRS_CHECK_DIR:-${TMPDIR:-/tmp}/krs-check}"
        git_libdir=$(pkg-config --variable=libdir libgit2)
        mkdir -p "$out"
        odin {{.ACTION}} {{.PACKAGE}} -out:"$out/{{.BINARY}}" -vet -o:none \
          "-extra-linker-flags:-L\"$git_libdir\""
        if [ '{{.QUIET}}' != true ]; then
          printf 'krs: %s complete (%s/%s)\n' '{{.ACTION}}' "$out" '{{.BINARY}}'
        fi
